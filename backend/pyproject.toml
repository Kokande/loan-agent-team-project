[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-agent-backend"
version = "0.1.0"
description = "RAG по нормативным документам на PostgreSQL и pgvector"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "pypdf>=5,<7",
    "python-docx>=1.1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires RAG_TEST_DATABASE_URL pointing to a disposable database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
